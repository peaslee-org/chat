[project]
name = "transcription-worker"
version = "0.1.0"
description = "Fargate worker for audio transcription and speaker diarization"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.34.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3",
    "pydub>=0.25",
    "scipy>=1.11.0",
    "gpu-worker",
    # pyannote.audio, torch, torchaudio, speechbrain installed separately in Dockerfile (large packages)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
gpu-worker = { path = "../gpu-worker", editable = true }
