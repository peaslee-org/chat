name: Terraform Validate

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/tf-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      # Without this, one environment's failure cancels the others mid-run and
      # their real status is never reported. staging/dev/transcription-prod have
      # failed `terraform validate` since the initial commit (missing required
      # module arguments), which was silently cancelling prod's checks too.
      fail-fast: false
      matrix:
        environment: [prod, staging, dev, transcription-prod]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform fmt check
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate
