name: Deploy — transcription-worker

on:
  push:
    branches: [main]
    paths:
      - 'transcription-worker/**'
      - '.github/workflows/worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    env:
      AWS_REGION:       us-east-1
      ECR_REPOSITORY:   transcription-worker-prod
      ECS_CLUSTER:      chat-api-prod
      ECS_SERVICE:      transcription-prod-worker
      TASK_FAMILY:      transcription-prod-worker
      CONTAINER_NAME:   transcription-worker

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Configure AWS credentials (OIDC)
        # default-region not set here — handled via env.AWS_REGION below
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/transcription-prod-worker-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Pause worker (set S3 flag)
        run: |
          BUCKET=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query "taskDefinition.containerDefinitions[0].environment[?name=='AUDIO_BUCKET_NAME'].value" \
            --output text)
          echo "AUDIO_BUCKET_NAME=$BUCKET" >> "$GITHUB_ENV"
          printf "true" | aws s3 cp - "s3://${BUCKET}/worker_paused"
          echo "Paused: s3://${BUCKET}/worker_paused"

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_BUILDKIT: "1"
        working-directory: transcription-worker
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build \
            --cache-from "$IMAGE_URI:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg HUGGINGFACE_TOKEN="${{ secrets.HUGGINGFACE_TOKEN }}" \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Unpause worker (clear S3 flag)
        if: always()
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].runningCount" \
            --output text)
          if [[ "$RUNNING" -gt 0 ]]; then
            printf "false" | aws s3 cp - "s3://${AUDIO_BUCKET_NAME}/worker_paused"
            echo "Unpaused: s3://${AUDIO_BUCKET_NAME}/worker_paused"
          else
            echo "Worker not running — pause flag left as-is"
          fi
