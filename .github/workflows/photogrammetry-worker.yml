name: Deploy — photogrammetry-worker

on:
  push:
    branches: [main]
    paths:
      - 'photogrammetry-worker/**'
      - 'gpu-worker/**'
      - '.github/workflows/photogrammetry-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    env:
      AWS_REGION:       us-east-1
      ECR_REPOSITORY:   photogrammetry-prod-worker
      ECS_CLUSTER:      chat-api-prod
      TASK_FAMILY:      photogrammetry-prod-worker
      CONTAINER_NAME:   photogrammetry-worker

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h

      - name: Configure AWS credentials (OIDC)
        # default-region not set here — handled via env.AWS_REGION below
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PHOTOGRAMMETRY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          # provenance/sbom off: buildx would push an OCI index plus two untagged attestation
          # manifests per image, and the repo's keep-last-2 lifecycle rule counts all three —
          # the next push would expire a live image's own children. One manifest per push, as
          # worker.yml's plain docker push produces.
          docker buildx build \
            --provenance=false --sbom=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f photogrammetry-worker/Dockerfile \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            --push .
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.TASK_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Register new task definition revision
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          # no service/cluster: the API launches this family's latest revision with RunTask
