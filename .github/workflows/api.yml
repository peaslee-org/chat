name: Deploy — chat-api
# Reusable: called by deploy.yml in dependency order; no push trigger of its own.

on:
  workflow_call:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: chat-api

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: chat-api
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        working-directory: chat-api
        # Exit code 5 = no tests collected; treat as success until test files exist.
        run: uv run pytest tests/unit --tb=short -q || [ $? -eq 5 ]

  build:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_API }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        working-directory: chat-api
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    needs: build
    if: vars.ECS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      ECS_CLUSTER: chat-api-prod
      ECS_SERVICE: chat-api-prod
      CONTAINER_NAME: chat-api
      TASK_DEFINITION_FAMILY: chat-api-prod
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_API }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition and deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json | \
            jq --arg IMAGE "$IMAGE" \
              '(.containerDefinitions[] | select(.name == "'"$CONTAINER_NAME"'")).image = $IMAGE
               | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                     .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
